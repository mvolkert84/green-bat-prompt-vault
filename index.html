<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0906">
  <meta name="description" content="Green Bat Music: a searchable, offline-first Suno prompt library for all your music projects.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css?v=underground-photo-v1">
  <link rel="stylesheet" href="./record-vault.css?v=underground-photo-v1">
  <title>Green Bat · Underground Record Vault</title>
</head>
<body class="vault-v3">
<div class="app-shell">
  <header class="site-header">
    <button class="icon-button mockup-menu-button" type="button" data-action="open-vault-menu" title="Vault menu" aria-label="Open vault menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <button class="icon-button mockup-back-button" type="button" data-go="home" title="Back to vault" aria-label="Back to vault">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m14 5-7 7 7 7M7 12h14"/></svg>
    </button>
    <div class="brand" role="button" tabindex="0" data-go="home" aria-label="Green Bat Prompt Vault home">
      <img class="brand-logo" src="./assets/vault/brand-lockup.webp" alt="Green Bat Music">
    </div>
    <button class="icon-button mockup-search-button" type="button" data-action="focus-vault-search" aria-label="Search the vault" title="Search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.9" cy="10.9" r="7.2"/><path d="m16.2 16.2 5.2 5.2"/></svg>
    </button>
    <button class="icon-button mockup-favorites-button" type="button" data-go="favorites" title="Favorite prompts" aria-label="Favorite prompts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m12 2 3.1 6.3 7 1-5 4.9 1.2 6.9-6.3-3.3-6.3 3.3 1.2-6.9-5-4.9 7-1z"/></svg>
    </button>
    <button class="icon-button" id="installButton" type="button" title="Install app" aria-label="Install app" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12m-4-4 4 4 4-4M4 17v3h16v-3"/></svg>
    </button>
    <button class="icon-button mockup-settings-button" type="button" data-action="open-settings" title="Library and backups" aria-label="Library and backups">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
    </button>
  </header>

  <main id="mainContent" tabindex="-1"></main>

  <nav class="bottom-nav" aria-label="Primary">
    <button type="button" data-go="home" id="nav-home" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m3 11 9-8 9 8v10h-6v-7H9v7H3z"/></svg><span>Home</span></button>
    <button type="button" data-action="show-groups" id="nav-groups" aria-label="Music groups"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 2 10 6-10 6L2 8z"/><path d="m2 13 10 6 10-6M2 18l10 5 10-5"/></svg><span>Groups</span></button>
    <button type="button" data-go="favorites" id="nav-favorites" aria-label="Favorites"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 2 3.1 6.3 7 1-5 4.9 1.2 6.9-6.3-3.3-6.3 3.3 1.2-6.9-5-4.9 7-1z"/></svg><span>Favorites</span></button>
    <button type="button" data-action="add-prompt" id="nav-add" aria-label="Add a prompt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4v16M4 12h16"/></svg><span>Add Prompt</span></button>
  </nav>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div class="modal-scrim" id="modalScrim" hidden><div class="modal" id="modalBody" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div></div>
<input id="importFile" type="file" accept="application/json,.json" hidden>
<script src="./starter-data.js?v=vertigo-2026-11"></script>
<script src="./app.js?v=vertigo-2026-11"></script>
</body>
</html>
