<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1113">
  <meta name="description" content="Green Bat Music: a searchable, offline-first Suno prompt library for all your music projects.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css?v=compact-v3-20261118">
  <style id="compact-cards-fallback">
/* Critical compact cards: usable even if a previously cached stylesheet is returned. */
.group-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.group-card{min-height:158px;padding:12px;border-radius:16px;justify-content:flex-start}
.group-card .monogram{display:none}
.group-card .group-thumb{width:64px;height:64px;aspect-ratio:1;border-radius:13px;flex:none}
.group-card .group-thumb .group-icon{width:100%;height:100%;border-radius:12px;font-size:23px;box-shadow:none}
.group-card .group-copy{padding-top:11px;min-width:0}
.group-card h3{font-size:15px;line-height:1.2;margin:0 0 5px;overflow-wrap:anywhere}
.group-card p{font-size:11px;line-height:1.35;margin:0 0 8px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
@media(min-width:640px){.group-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.group-card{min-height:170px;padding:15px}.group-card .group-thumb{width:76px;height:76px}.group-card h3{font-size:17px}}
@media(min-width:960px){.group-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.group-card{min-height:174px}}
@media(max-width:360px){.group-card{padding:10px;min-height:150px}.group-card .group-thumb{width:56px;height:56px}.group-card h3{font-size:14px}}
</style>
<title>Green Bat · Prompt Vault</title>
</head>
<body>
<div class="app-shell">
  <header class="site-header">
    <div class="brand" role="button" tabindex="0" data-go="home" aria-label="Home">
      <img class="brand-logo" src="./icons/green-bat-logo.png" alt="Green Bat Music">
      <span class="brand-badge">PROMPT VAULT</span>
    </div>
    <button class="icon-button" id="installButton" type="button" title="Install on phone" aria-label="Install app" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 17v3h16v-3"/></svg>
    </button>
    <button class="icon-button" type="button" data-action="open-settings" title="Library and backups" aria-label="Library and backups">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.04.04-1.84 1.84-.04-.04A1.7 1.7 0 0 0 16 18.4a1.7 1.7 0 0 0-1.1 1.57V21H9.1v-1.03A1.7 1.7 0 0 0 8 18.4a1.7 1.7 0 0 0-1.88.34l-.04.04-1.84-1.84.04-.04A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.57-1.1H2v-3.8h1.03A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.88l-.04-.04 1.84-1.84.04.04A1.7 1.7 0 0 0 8 5.6a1.7 1.7 0 0 0 1.1-1.57V3h5.8v1.03A1.7 1.7 0 0 0 16 5.6a1.7 1.7 0 0 0 1.88-.34l.04-.04 1.84 1.84-.04.04A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.57 1.1H22v3.8h-1.03A1.7 1.7 0 0 0 19.4 15Z"/></svg>
    </button>
  </header>

  <main id="mainContent" tabindex="-1"></main>

  <nav class="bottom-nav" aria-label="Primary">
    <button type="button" data-go="home" id="nav-home" aria-label="Groups"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.4"/><rect x="14" y="3" width="7" height="7" rx="1.4"/><rect x="3" y="14" width="7" height="7" rx="1.4"/><rect x="14" y="14" width="7" height="7" rx="1.4"/></svg><span>Groups</span></button>
    <button type="button" data-go="favorites" id="nav-favorites" aria-label="Favorites"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 3.1 6.3 7 1-5 4.9 1.2 6.9-6.3-3.3-6.3 3.3 1.2-6.9-5-4.9 7-1z"/></svg><span>Favorites</span></button>
    <button type="button" data-action="add-prompt" id="nav-add" aria-label="Add a prompt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Add Prompt</span></button>
  </nav>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div class="modal-scrim" id="modalScrim" hidden><div class="modal" id="modalBody" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div></div>
<input id="importFile" type="file" accept="application/json,.json" hidden>
<script src="./starter-data.js?v=compact-v3-20261118"></script>
<script src="./app.js?v=compact-v3-20261118"></script>
<script>
/* Refresh once when a newer offline worker takes control. Never touches user data. */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!sessionStorage.getItem('greenbat-controller-reload-v3')) {
      sessionStorage.setItem('greenbat-controller-reload-v3', '1');
      location.reload();
    }
  });
}
</script>
</body>
</html>
