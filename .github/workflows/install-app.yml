name: Install Prompt Vault App Files
on:
  push:
    paths:
      - .github/workflows/install-app.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify and unpack the application
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-{00..08}.b64 | base64 --decode > /tmp/green-bat-source.zip
          echo "3a1c10244707e01f78e1950f5df9ab89259ff61f5350b115981c074d5fdd9c51  /tmp/green-bat-source.zip" | sha256sum -c -
          unzip -o /tmp/green-bat-source.zip -d .
          python3 -c 'from pathlib import Path; Path("starter-data.js").write_text("window.GREEN_BAT_STARTER = "+Path("starter-data.json").read_text(encoding="utf-8").strip()+";\n",encoding="utf-8")'
          touch .nojekyll
          python3 -c 'import json; d=json.load(open("starter-data.json")); assert len(d["groups"])==8; assert sum(len(g["prompts"]) for g in d["groups"])==39; print("Verified 8 groups, 39 prompts")'
          test -s app.js && test -s styles.css && test -s index.html && test -s service-worker.js && test -s manifest.webmanifest
          test -s icons/icon-192.png && test -s icons/icon-512.png

      - name: Commit application files to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js styles.css starter-data.js starter-data.json service-worker.js manifest.webmanifest icons/icon-192.png icons/icon-512.png .nojekyll
          if git diff --cached --quiet; then
            echo "Application files are already installed"
          else
            git commit -m "Install Green Bat Prompt Vault PWA application"
            git push origin main
          fi
