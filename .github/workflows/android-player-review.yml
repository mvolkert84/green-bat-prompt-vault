name: Android player review

on:
  push:
    branches: [review/vinyl-lyric-sync]

permissions:
  contents: read

jobs:
  android-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Build the Android app for this emulator only
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm test
          npm run build:web
          printf '%s\n' 'window.GREEN_BAT_CLOUD_CONFIG = { endpoint: "" };' > www/cloud-config.js
          npx cap add android
          node scripts/install-android-icon.mjs
          npx cap sync android
          cd android
          ./gradlew --no-daemon assembleDebug
      - name: Enable hardware virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify and record the actual Android player
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: false
          script: node scripts/android-player-review.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: android-player-review-proof
          path: android-review-proof/
          if-no-files-found: error
          retention-days: 14
