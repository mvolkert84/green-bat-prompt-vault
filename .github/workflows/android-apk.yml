name: Green Bat Music Android APK

on:
  push:
    branches:
      - build/vinyl-phone-apk
  workflow_dispatch:

concurrency:
  group: green-bat-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Build ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: green-bat-music-vinyl-apk
            alongside: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the music player branch
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android dependencies
        run: npm install --no-audit --no-fund

      - name: Check player scripts
        run: npm run check

      - name: Test cloud streaming service
        run: npm test

      - name: Package existing Underground Record Vault assets
        run: npm run build:web

      - name: Give the alongside build a separate Android app ID
        if: matrix.alongside
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const path = 'capacitor.config.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.appId += '.vinyl';
          config.appName += ' (Vinyl)';
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          JS

      - name: Create Android project
        run: npx cap add android

      - name: Install Green Bat launcher icon
        run: node scripts/install-android-icon.mjs

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Build Android debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
